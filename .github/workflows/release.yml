name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build static binaries
        run: make release
      - name: Package
        run: |
          V=$(cat VERSION)
          mkdir -p dist "vole-$V"
          git archive HEAD | tar -x -C "vole-$V"
          cp bin/vole-*-linux-* "vole-$V/bin/"
          tar czf "dist/vole-$V-linux.tar.gz" "vole-$V"
          cp bin/vole-*-linux-* dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
